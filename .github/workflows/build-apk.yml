# Builds the release APK on GitHub's runners (which have the Android SDK
# preinstalled). On every branch push it's committed to dist/, and — when the
# versionName in build.gradle.kts names a version that has no GitHub Release
# yet — it's AUTOMATICALLY published as a Release with the APK attached. So
# cutting a release is just: bump versionName, push. No manual tag command.
# (An explicit `v*` tag push still publishes too, for one-off manual tags.)
# Runs the JVM unit test suite first — a red test suite never ships an APK.
name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Stable release signing (v0.7): when the two repo secrets are set, the
      # keystore is materialized and build.gradle.kts picks up
      # keystore.properties automatically — every build then carries the SAME
      # signature, so users update in place instead of uninstall/reinstall.
      # Without the secrets this is a no-op and the build falls back to a
      # throwaway debug key, exactly as before (forks stay green).
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "No signing secrets — building with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > subwave-auto-fork.keystore
          {
            echo "storeFile=../subwave-auto-fork.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=subwaveauto"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          echo "Release signing configured (stable key)"

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subwave-auto-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Commit the APK into dist/ so it can be fetched with a plain git pull.
      # [skip ci] keeps this push from re-triggering the workflow. Branch
      # pushes only — a tag ref has nothing to push a commit onto.
      - name: Commit APK to dist/
        if: github.ref_type == 'branch'
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/subwave-auto-${VERSION}.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && echo "APK unchanged, nothing to commit" && exit 0
          git commit -m "ci: built APK ${VERSION} (${GITHUB_SHA::7}) [skip ci]"
          git push

      # AUTO-RELEASE on version bump (branch push): if versionName has no
      # matching vX.Y.Z release yet, cut the tag at this commit and publish the
      # APK. When the release already exists this no-ops, so ordinary dev
      # commits (same version) publish nothing — only a version bump does.
      # This is what makes releasing hands-off: bump the number, push, done.
      - name: Auto-publish release on version bump
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — bump versionName to cut a new one."
            exit 0
          fi
          ASSET="dist-release/subwave-auto-${VERSION}.apk"
          mkdir -p dist-release
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          gh release create "$TAG" "$ASSET" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "SUB/WAVE Auto ${VERSION}" \
            --notes "Sideload APK for SUB/WAVE Auto ${VERSION}. Install steps: docs/SIDELOAD_RUNBOOK.md."
          echo "Published release $TAG"

      # Explicit `v*` tag push → publish (or refresh) that named release. Kept
      # for the occasional manual tag; the auto path above covers normal use.
      - name: Publish GitHub Release (manual tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          ASSET="dist-release/subwave-auto-${VERSION}.apk"
          mkdir -p dist-release
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "$ASSET" --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" "$ASSET" \
              --repo "${{ github.repository }}" \
              --title "SUB/WAVE Auto ${VERSION}" \
              --notes "Sideload APK for SUB/WAVE Auto ${VERSION}. Install steps: docs/SIDELOAD_RUNBOOK.md."
          fi
