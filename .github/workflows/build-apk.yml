# Builds the release APK on GitHub's runners (which have the Android SDK
# preinstalled) and commits it to dist/ on the same branch, so a sideload
# APK can be produced without a local Android toolchain. Runs the JVM unit
# test suite first — a red test suite never ships an APK.
name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subwave-auto-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Commit the APK into dist/ so it can be fetched with a plain git pull.
      # [skip ci] keeps this push from re-triggering the workflow.
      - name: Commit APK to dist/
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/subwave-auto-${VERSION}.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && echo "APK unchanged, nothing to commit" && exit 0
          git commit -m "ci: built APK ${VERSION} (${GITHUB_SHA::7}) [skip ci]"
          git push
